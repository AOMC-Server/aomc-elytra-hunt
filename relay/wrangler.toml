name = "aomc-looted-relay"
main = "src/index.ts"
compatibility_date = "2026-01-01"

[vars]
REPO = "AOMC-Server/aomc-elytra-hunt"
ALLOWED_ORIGIN = "https://aomc-server.github.io"
WORKFLOW = "update-webmap.yml"

# Once an hour, start the webmap update workflow on GitHub.
[triggers]
crons = ["23 * * * *"]

# GITHUB_TOKEN is a secret: set it with `npx wrangler secret put GITHUB_TOKEN`.
