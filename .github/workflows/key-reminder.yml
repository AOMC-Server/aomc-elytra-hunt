name: Remind about expiring keys

# The two keys the relay depends on expire on different dates:
#   - Cloudflare API token (GitHub secret CLOUDFLARE_API_TOKEN): 31 December 2026
#   - GitHub token (Cloudflare secret GITHUB_TOKEN): 30 January 2027
# This opens an issue ahead of each one, mentioning the owner so GitHub
# notifies them. December runs remind about the Cloudflare token and January
# runs about the GitHub token; a manual run reminds about both. When a key is
# renewed with a new expiry date, update its dates and text below.

on:
  schedule:
    - cron: '0 15 1 12 *'
    - cron: '0 15 15 12 *'
    - cron: '0 15 27 12 *'
    - cron: '0 15 2 1 *'
    - cron: '0 15 16 1 *'
    - cron: '0 15 27 1 *'
  workflow_dispatch:

permissions:
  issues: write

jobs:
  remind:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      OWNER: sh4sh
      MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Open or bump the reminders
        run: |
          remind() {
            title=$1 expiry=$2 body=$3
            existing=$(gh issue list --state open --search "in:title \"$title\"" --json number -q '.[0].number')
            if [ -n "$existing" ]; then
              gh issue comment "$existing" --body "@$OWNER reminder: this key still needs renewing before $expiry."
            else
              gh issue create --title "$title" --body "$body"
            fi
          }

          month=$(date -u +%m)
          footer="**To check it worked:** run *Deploy the relay* from the Actions tab, and send a test submission from the app.

          Afterwards, update the dates in \`.github/workflows/key-reminder.yml\` and close this issue."

          if [ "$month" = 12 ] || [ "$MANUAL" = true ]; then
            remind "Renew the relay's Cloudflare API token before 31 December" "31 December" \
          "@$OWNER the Cloudflare API token GitHub uses to deploy the relay expires on **31 December 2026**. When it lapses, relay deploys stop working.

          - Cloudflare: My Profile → API Tokens → roll or recreate the *Edit Cloudflare Workers* token.
          - Then in this repository: Settings → Secrets and variables → Actions → update \`CLOUDFLARE_API_TOKEN\`.

          $footer"
          fi

          if [ "$month" = 01 ] || [ "$MANUAL" = true ]; then
            remind "Renew the relay's GitHub token before 30 January" "30 January" \
          "@$OWNER the GitHub token the relay uses (files issues, starts the webmap update) expires on **30 January 2027**. When it lapses, looted-city submissions, ship reports and the hourly webmap update all stop working.

          - GitHub: Settings → Developer settings → Fine-grained tokens → regenerate the relay's token with a new expiry. Keep *Issues: Read and write* and *Actions: Read and write* on this repository only.
          - Then from \`relay/\`: \`npx wrangler secret put GITHUB_TOKEN\` and paste the new token.

          $footer"
          fi
